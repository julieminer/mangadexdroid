name: Android CI

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  Gradle:
    runs-on: ubuntu-22.04
    steps:
    - name: checkout code
      uses: actions/checkout@v2
    - name: setup jdk
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: Check pwd
      run: pwd
    - name: Check dir
      run: ls -l
    - name: Make Gradle executable
      run: chmod +x ./gradlew
    - name: Bump version
      uses: chkfung/android-version-actions@v1.1
      with:
        gradlePath: app/build.gradle
        versionCode: ${{github.run_number}}
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    - name: Sign Android
      uses: Tlaster/android-sign@v1.2.2
      with:
        releaseDirectory: app/build/outputs/apk/debug/
        signingKeyBase64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        alias: ${{ secrets.DEBUG_KEYSTORE_ALIAS }}
        keyStorePassword: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        output: app/build/outputs/apk/debug/signed/
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          app/build/outputs/apk/debug/signed/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
