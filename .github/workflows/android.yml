name: Android CI

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  Gradle:
    runs-on: ubuntu-22.04
    steps:
    - name: checkout code
      uses: actions/checkout@v2
    - name: setup jdk
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: Check pwd
      run: pwd
    - name: Check dir
      run: ls -l
    - name: Make Gradle executable
      run: chmod +x ./gradlew
    - name: Bump version
      uses: chkfung/android-version-actions@v1.1
      with:
        gradlePath: app/build.gradle
        versionCode: ${{github.run_number}}
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    - name: Sign Android
      # You may pin to the exact commit or the version.
      # uses: noriban/sign-android-release@5f144321d3c7c2233266e78b42360345d8bbe403
      uses: noriban/sign-android-release@v5.1
      with:
        # The directory to find your release to sign
        releaseDirectory: app/build/outputs/apk/debug/
        # The key used to sign your release in base64 encoded format
        signingKeyBase64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        # The key alias
        alias: ${{ secrets.DEBUG_KEYSTORE_ALIAS }}
        # The password to the keystore
        keyStorePassword: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        # The password for the key
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          app/build/outputs/apk/debug/signed/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
